<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추억 놀이 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 홈: 화면 전체가 옛날 모니터. 화면 속은 옛날 컴퓨터 바탕화면(사진 배경 + 모니터 도트 + 아이콘 + 작업표시줄). 웹캠 없이 마우스로
     아이콘을 열면 창이 커지고, 브라운관이 '팟' 꺼지듯 줄어들며 그 놀이로 이동 */
  :root {
    --ui: "Gowun Dodum", "Tahoma", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --ic: clamp(76px, 12vmin, 132px);          /* 바탕화면 아이콘 크기 */
    --bar: clamp(30px, 4.6vmin, 44px);          /* 작업표시줄 높이 */
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #e9e1cd; font-family: var(--ui); }
  #cam { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ───── 모니터 테두리 (첫 번째 참고 이미지처럼 검은 플라스틱) ───── */
  .monitor { position: fixed; inset: 0; padding: 3.2vmin 3.2vmin 7.5vmin; box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 0%, #f8f3e6 0%, #ece4cf 55%, #ddd2b8 100%); }   /* 아이보리 플라스틱 */
  .monitor::after { /* 플라스틱 결 */ content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(120,100,60,.025) 0 1px, transparent 1px 3px); }
  .recess { position: relative; height: 100%; padding: 1.3vmin; box-sizing: border-box; border-radius: 2.4vmin;
    background: linear-gradient(180deg, #cfc4a8, #e2d8bf); box-shadow: inset 0 0.6vmin 1.2vmin rgba(90,70,30,.45), inset 0 -1px 0 rgba(255,255,255,.6), 0 1px 0 rgba(255,255,255,.8); }
  .screen { position: relative; height: 100%; overflow: hidden; background: #000;
    border-radius: 3.6vmin / 4.2vmin; box-shadow: 0 0 0 1px #000; }
  .led { position: absolute; right: 5vmin; bottom: 3vmin; width: 0.9vmin; height: 0.9vmin; min-width: 6px; min-height: 6px; border-radius: 50%;
    background: #b9ae94; box-shadow: inset 0 1px 1px rgba(90,70,30,.5); transition: background 300ms, box-shadow 300ms; }
  .led.on { background: #62e36b; box-shadow: 0 0 6px #62e36b, 0 0 14px rgba(98,227,107,.5); }

  /* ───── 브라운관 속 (켜고 끌 때 통째로 줄었다 늘었다) ───── */
  .tube { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .tube.off { transform: scale(0, 0.003); filter: brightness(4); }
  .tube.power-on { animation: crtOn 700ms cubic-bezier(.2,.8,.3,1) both; }
  .tube.power-off { animation: crtOff 560ms cubic-bezier(.6,0,.9,.4) both; }
  @keyframes crtOn { 0% { transform: scale(0, .003); filter: brightness(4); } 35% { transform: scale(1, .006); filter: brightness(4); } 100% { transform: none; filter: none; } }
  @keyframes crtOff { 0% { transform: none; filter: none; } 55% { transform: scale(1, .006); filter: brightness(4); } 100% { transform: scale(0, .003); filter: brightness(6); } }

  /* 바탕화면: 도트 배경 (두 번째 참고 이미지) */
  .desk { position: absolute; inset: 0; background: #2b6fd6 center / cover no-repeat; filter: saturate(1.08) contrast(1.03) blur(0.3px); }

  /* 바탕화면 아이콘 */
  .icons { position: absolute; left: 1.6%; top: 2.4%; bottom: calc(var(--bar) + 1.5%); display: grid; grid-auto-flow: column;
    grid-template-rows: repeat(auto-fill, calc(var(--ic) * 1.18)); grid-auto-columns: calc(var(--ic) * 1.15); gap: 0.4vmin 0.6vmin; }
  .icon { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px; border-radius: 3px; text-align: center; }
  .icon .pic { width: calc(var(--ic) * 0.56); height: calc(var(--ic) * 0.56); position: relative; filter: drop-shadow(1px 2px 1px rgba(0,0,0,.45)); }
  .icon .pic svg { width: 100%; height: 100%; }
  .icon .label { font-size: clamp(12px, 1.9vmin, 17px); line-height: 1.25; color: #fff; padding: 1px 3px; border-radius: 2px;
    text-shadow: 1px 1px 1px #000, 0 0 2px rgba(0,0,0,.8); word-break: keep-all; }
  .icon.sel .label { background: #316ac5; text-shadow: none; outline: 1px dotted rgba(255,255,255,.8); }
  .icon.sel .pic::after { content: ""; position: absolute; inset: 0; background: rgba(49,106,197,.45); mix-blend-mode: multiply; border-radius: 4px; }
  .icon:focus-visible { outline: 1px dotted #fff; }

  /* 작업표시줄 */
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar); display: flex; align-items: stretch;
    background: linear-gradient(180deg, #3d8af7 0%, #245edb 9%, #2257d5 50%, #1f4fc0 90%, #1941a5 100%); box-shadow: 0 -1px 0 #0c3db6; }
  .start { display: flex; align-items: center; gap: 0.6em; padding: 0 1.4em 0 0.7em; border-radius: 0 12px 12px 0;
    background: linear-gradient(180deg, #5eb75e 0%, #3c9a3c 12%, #3a993a 70%, #2f7f2f 100%); box-shadow: inset -1px 0 2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
    color: #fff; font-family: var(--display); font-style: italic; font-size: calc(var(--bar) * 0.5); text-shadow: 1px 1px 1px rgba(0,0,0,.5); }
  .start svg { width: calc(var(--bar) * 0.55); height: calc(var(--bar) * 0.55); }
  .start.on, .start.hot { filter: brightness(1.12); }
  .tasks { flex: 1; display: flex; align-items: center; padding: 0 8px; gap: 6px; }
  .task { height: 76%; display: flex; align-items: center; gap: 6px; padding: 0 12px; min-width: 0; max-width: 220px; border-radius: 3px; color: #fff;
    font-size: calc(var(--bar) * 0.34); background: linear-gradient(180deg, #3c81f3, #2a64dc); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); white-space: nowrap; overflow: hidden; }
  .task svg { width: 1.4em; height: 1.4em; flex: none; }
  .tray { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 12px; color: #fff; font-size: calc(var(--bar) * 0.36);
    background: linear-gradient(180deg, #19b9f3 0%, #0f8fe0 10%, #0f8bdc 85%, #0c6fbf 100%); box-shadow: inset 1px 0 0 #0b5ea8, inset 2px 0 0 rgba(255,255,255,.25); }

  /* 시작 메뉴 */
  .menu { position: absolute; left: 0; bottom: var(--bar); width: min(46vmin, 380px); border-radius: 8px 8px 0 0; overflow: hidden;
    background: #fff; box-shadow: 2px -2px 10px rgba(0,0,0,.45); border: 1px solid #1e57c9; }
  .menu-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #fff; font-family: var(--display); font-size: clamp(14px, 2.2vmin, 20px);
    background: linear-gradient(180deg, #1f6ae0, #3d8af7 40%, #1d5fd6); text-shadow: 1px 1px 1px rgba(0,0,0,.4); }
  .menu-head .avatar { width: clamp(34px, 5vmin, 48px); height: clamp(34px, 5vmin, 48px); border-radius: 5px; border: 2px solid #fff; background: #ffd1ea; display: grid; place-items: center; }
  .menu-head .avatar svg { width: 76%; height: 76%; }
  .menu-list { padding: 6px; display: grid; gap: 2px; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 3px; color: #1a1a1a; text-align: left; font-size: clamp(13px, 1.8vmin, 16px); }
  .menu-item svg { width: clamp(24px, 3.4vmin, 32px); height: clamp(24px, 3.4vmin, 32px); flex: none; }
  .menu-item:hover, .menu-item.hot { background: #316ac5; color: #fff; }
  .menu-foot { height: 8px; background: linear-gradient(180deg, #3d8af7, #1d5fd6); }

  /* 열리는 창 (아이콘에서 화면 가득 커짐) */
  .win { position: absolute; z-index: 5; transition-property: left, top, width, height, opacity; border-radius: 7px 7px 0 0; overflow: hidden; background: #ece9d8; border: 1px solid #0831d9;
    box-shadow: 2px 3px 10px rgba(0,0,0,.45); transition: left 420ms cubic-bezier(.3,.7,.3,1), top 420ms cubic-bezier(.3,.7,.3,1), width 420ms cubic-bezier(.3,.7,.3,1), height 420ms cubic-bezier(.3,.7,.3,1); }
  .win-title { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: #fff; font-family: var(--display); font-size: 14px;
    background: linear-gradient(180deg, #0997ff 0%, #0053ee 8%, #0050ee 40%, #06f 88%, #0053ee 100%); text-shadow: 1px 1px 1px rgba(0,0,0,.5); white-space: nowrap; overflow: hidden; }
  .win-title svg { width: 18px; height: 18px; flex: none; }
  .win-btns { margin-left: auto; display: flex; gap: 3px; flex: none; }
  .win-btn { position: relative; width: 22px; height: 22px; border-radius: 3px; border: 1px solid #fff; overflow: hidden; display: grid; place-items: center;
    background: linear-gradient(180deg, #4a8cff, #1f5fe0); box-shadow: inset 0 0 1px rgba(0,0,0,.4); }
  .win-btn svg { width: 12px !important; height: 12px !important; position: relative; }
  .win-btn:hover { filter: brightness(1.15); }
  .win-btn:focus-visible { outline: 2px dotted #fff; outline-offset: 2px; }
  .win-btn.x { background: linear-gradient(180deg, #e98a6c, #d24b26 55%, #c03b1a); }
  .win-btn.x.hot { filter: brightness(1.25); transform: scale(1.12); }
  .win-fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0%; background: rgba(255,255,255,.55); }
  .win iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .tube.has-win ~ .crt.dots, .tube.has-win ~ .crt.rgb, .tube.has-win ~ .crt.lines { opacity: 0; }   /* 놀이 창이 열려 있으면 놀이 쪽 도트만 보이게 */
  .win-body { position: absolute; inset: 28px 3px 3px; display: grid; place-items: center; overflow: hidden; }
  .win-body svg { width: 30%; max-width: 260px; height: auto; }

  /* 브라운관 느낌: 촘촘한 점 + 가장자리 어둡게 + 유리 반사 */
  .crt { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
  .crt.dots { background: radial-gradient(circle, transparent 40%, rgba(0,0,0,.3) 85%) 0 0 / 3px 3px; }
  .crt.rgb { background: repeating-linear-gradient(90deg, rgba(255,60,60,.05) 0 1px, rgba(60,255,90,.05) 1px 2px, rgba(70,110,255,.05) 2px 3px); mix-blend-mode: screen; }
  .crt.lines { background: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px); }
  .crt.vignette { box-shadow: inset 0 0 7vmin 1vmin rgba(0,0,0,.6), inset 0 0 1.5vmin rgba(0,0,0,.5); border-radius: inherit; }
  .crt.glare { background: radial-gradient(ellipse 70% 45% at 28% 12%, rgba(255,255,255,.14), transparent 60%), linear-gradient(160deg, rgba(255,255,255,.06), transparent 40%); }

  /* 처음 화면: 전원 켜기 */
  .poweron { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: #000; text-align: center; }
  .poweron button { display: grid; justify-items: center; gap: 14px; color: #9fe6a3; font-family: var(--display); font-size: clamp(16px, 2.6vmin, 24px); }
  .poweron .pw { width: clamp(56px, 9vmin, 84px); height: clamp(56px, 9vmin, 84px); border-radius: 50%; border: 3px solid #9fe6a3; display: grid; place-items: center;
    box-shadow: 0 0 18px rgba(159,230,163,.5); animation: pulse 1.6s ease-in-out infinite; }
  .poweron .pw svg { width: 50%; height: 50%; }
  .poweron small { display: block; max-width: 420px; color: #8a8f96; font-family: var(--ui); font-size: clamp(12px, 1.6vmin, 14px); line-height: 1.6; }
  .poweron button:focus-visible { outline: 2px dotted #9fe6a3; outline-offset: 8px; }
  @keyframes pulse { 50% { box-shadow: 0 0 30px rgba(159,230,163,.85); } }

  @media (prefers-reduced-motion: reduce) { .poweron .pw { animation: none; } }
</style>
</head>
<body>

<div class="monitor">
  <div class="recess">
    <div class="screen" id="screen">
      <div class="tube off" id="tube">
        <div class="desk" id="desk"></div>
        <div class="icons" id="icons" aria-label="바탕화면"></div>

        <div class="menu" id="menu" hidden>
          <div class="menu-head"><div class="avatar" id="avatar"></div><span>추억 놀이 아카이브</span></div>
          <div class="menu-list" id="menuList"></div>
          <div class="menu-foot"></div>
        </div>

        <div class="taskbar">
          <button class="start" id="startBtn" type="button" aria-label="시작 메뉴"><span id="startIcon"></span>시작</button>
          <div class="tasks" id="tasks"></div>
          <div class="tray"><span id="clock">--:--</span></div>
        </div>
      </div>
      <div class="crt rgb"></div>
      <div class="crt dots"></div>
      <div class="crt lines"></div>
      <div class="crt glare"></div>
      <div class="crt vignette"></div>

      <div class="poweron" id="poweron">
        <button id="powerBtn" type="button">
          <span class="pw"><svg viewBox="0 0 24 24" fill="none" stroke="#9fe6a3" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg></span>
          전원 켜기
          <small>바탕화면 아이콘을 <b>더블클릭</b>하면 그 놀이가 창으로 열려요. 시작 메뉴나 숫자키 1~7도 돼요.<br>창 오른쪽 위 ✕(또는 ESC, 검지로 ✕를 1초 가리키기)로 닫아요.</small>
        </button>
      </div>
    </div>
  </div>
  <div class="led" id="led"></div>
</div>

  el.type = 'button'; el.className = 'icon'; el.dataset.open = i;
  el.innerHTML = `<span class="pic">${p.icon}</span><span class="label">${p.name}</span>`;
  el.addEventListener('click', () => { select(i); playClick(); });
  el.addEventListener('dblclick', () => openPlay(i));
  el.addEventListener('keydown', e => { if (e.key === 'Enter') openPlay(i); });
  $('icons').appendChild(el);
  const m = document.createElement('button');
  m.type = 'button'; m.className = 'menu-item'; m.dataset.open = i;
  m.innerHTML = `${p.icon}<span>${p.name}</span>`;
  m.addEventListener('click', () => openPlay(i));
  $('menuList').appendChild(m);
  return el;
});
function select(i) { selected = i; iconEls.forEach((e, k) => e.classList.toggle('sel', k === i)); }
function toggleMenu(show) {
  const m = $('menu'), on = show === undefined ? m.hidden : show;
  m.hidden = !on; $('startBtn').classList.toggle('on', on);
  if (on) playBlip();
}
$('startBtn').addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
$('desk').addEventListener('click', () => { toggleMenu(false); select(-1); });
window.addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (powered && !openWin && n >= 1 && n <= PLAYS.length) openPlay(n - 1);
  if (e.key === 'Escape') { if (openWin) closePlay(); else toggleMenu(false); }
});

/* ───── 놀이 열기: 창이 아이콘에서 화면 가득 커짐 → 브라운관이 꺼지듯 줄어듦 → 이동 ───── */
/* 놀이 열기: 아이콘에서 창이 화면 가득 커지고, 창 안에서 그 놀이가 실행됨 (모니터는 그대로) */
let openWin = null;
function openPlay(i) {
  if (busy || !powered || openWin) return;
  busy = true; select(i); toggleMenu(false);
  const p = PLAYS[i], sr = tube.getBoundingClientRect(), ir = iconEls[i].getBoundingClientRect();
  const win = document.createElement('div'); win.className = 'win';
  win.innerHTML = `<div class="win-title">${p.icon}<span>${p.name}</span><span class="win-btns">
      <button class="win-btn" type="button" data-act="min" aria-label="닫기"><svg viewBox="0 0 12 12"><rect x="2" y="8" width="6" height="2.4" fill="#fff"/></svg></button>
      <button class="win-btn" type="button" data-act="max" aria-label="전체 화면"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="1.5" y="1.5" width="9" height="2.4" fill="#fff"/></svg></button>
      <button class="win-btn x" type="button" data-act="close" aria-label="닫고 바탕화면으로"><span class="win-fill"></span><svg viewBox="0 0 12 12"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
    </span></div><div class="win-body" style="background:${p.color}">${p.icon}</div>`;
  const from = { left: (ir.left - sr.left) + 'px', top: (ir.top - sr.top) + 'px', width: ir.width + 'px', height: ir.height + 'px' };
  Object.assign(win.style, from);
  tube.appendChild(win);
  const task = document.createElement('div'); task.className = 'task'; task.innerHTML = `${p.icon}<span>${p.name}</span>`; $('tasks').appendChild(task);
  openWin = { win, task, from, i };
  win.querySelector('.win-btns').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'max') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); b.blur(); }
    else closePlay();
  });
  playOpen();
  requestAnimationFrame(() => requestAnimationFrame(() => Object.assign(win.style, { left: '0px', top: '0px', width: sr.width + 'px', height: (sr.height - $('tasks').getBoundingClientRect().height) + 'px' })));
  // 창이 화면 가득 커지면 그 놀이로 이동. 놀이 화면도 똑같은 모니터·창·작업표시줄을 그려서 이어져 보임
  setTimeout(() => { location.href = p.id + '.html?shell=1'; }, 470);
}
// 놀이에서 돌아왔을 때: 화면 가득한 창이 아이콘 자리로 쏙 줄어듦
function shrinkBack(i) {
  const p = PLAYS[i], sr = tube.getBoundingClientRect(), ir = iconEls[i].getBoundingClientRect();
  const win = document.createElement('div'); win.className = 'win';
  win.innerHTML = `<div class="win-title">${p.icon}<span>${p.name}</span></div><div class="win-body" style="background:#000"></div>`;
  win.style.transition = 'none';
  Object.assign(win.style, { left: '0px', top: '0px', width: sr.width + 'px', height: (sr.height - $('tasks').getBoundingClientRect().height) + 'px' });
  tube.appendChild(win);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    win.style.transition = ''; win.querySelector('.win-body').style.background = p.color;
    Object.assign(win.style, { left: (ir.left - sr.left) + 'px', top: (ir.top - sr.top) + 'px', width: ir.width + 'px', height: ir.height + 'px', opacity: '0.2' });
  }));
  setTimeout(() => win.remove(), 460);
}
function closePlay() {
  if (!openWin || openWin.closing) return;
  const w = openWin; w.closing = true;
  w.win.querySelector('.win-body').innerHTML = '';          // 놀이를 끄면 카메라도 꺼짐
  w.win.querySelector('.win-body').style.background = PLAYS[w.i].color;
  tube.classList.remove('has-win');
  Object.assign(w.win.style, w.from);
  playClose();
  setTimeout(() => { w.win.remove(); w.task.remove(); openWin = null; window.focus(); }, 430);
}
// 놀이 창 안에서 보내는 신호: ESC/닫기, 검지 끝 위치(✕를 1초 가리키면 닫힘)
let xSince = 0;
window.addEventListener('message', e => {
  const d = e.data || {};
  if (!openWin) return;
  if (d.type === 'close') closePlay();
  if (d.type === 'tip') {
    const f = openWin.win.querySelector('iframe'), x = openWin.win.querySelector('.win-btn.x');
    if (!f || !x) return;
    const fr = f.getBoundingClientRect(), xr = x.getBoundingClientRect();
    const on = d.p && Math.abs(fr.left + d.p.x - (xr.left + xr.width / 2)) < 70 && (fr.top + d.p.y - (xr.top + xr.height / 2)) < 90;
    const now = performance.now();
    if (on) { if (!xSince) xSince = now; } else xSince = 0;
    const k = xSince ? Math.min(1, (now - xSince) / 1000) : 0;
    x.classList.toggle('hot', !!on); x.querySelector('.win-fill').style.height = (k * 100) + '%';
    if (k >= 1) { xSince = 0; closePlay(); }
  }
});
function powerOn(fromId) {
  powered = true;
  $('poweron').hidden = true;
  $('led').classList.add('on');
  tube.classList.remove('off');
  const i = PLAYS.findIndex(p => p.id === fromId);
  if (i >= 0) { select(i); shrinkBack(i); playClose(); return; }   // 놀이에서 돌아오면 켜져 있던 그대로
  tube.classList.add('power-on');
  playOn();
}

function tickClock() { const d = new Date(); $('clock').textContent = (d.getHours() < 12 ? '오전 ' : '오후 ') + ((d.getHours() + 11) % 12 + 1) + ':' + String(d.getMinutes()).padStart(2, '0'); }
setInterval(tickClock, 10000); tickClock();

/* ───── 소리 ───── */
function tone(f, t0, dur, type = 'sine', vol = 0.06, f2) {
  if (!ac) return;
  const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function playBlip() { tone(1800, 0, 0.03, 'square', 0.015); }
function playClick() { tone(2400, 0, 0.02, 'square', 0.03); }
function playOpen() { tone(660, 0, 0.12, 'triangle', 0.08); tone(990, 0.08, 0.18, 'triangle', 0.07); }
function playOn() { tone(60, 0, 0.5, 'sawtooth', 0.04, 15000); [523, 784, 1047, 1568].forEach((f, i) => tone(f, 0.35 + i * 0.12, 0.6, 'sine', 0.06)); }   // 브라운관 '징' + 띠리링
function playClose() { tone(990, 0, 0.1, 'triangle', 0.06); tone(660, 0.07, 0.14, 'triangle', 0.05); }
function playOff() { tone(9000, 0, 0.4, 'sine', 0.03, 200); tone(120, 0, 0.3, 'sawtooth', 0.04, 40); }

/* ───── 시작 ───── */
function start(fromId) {
  if (powered) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  powerOn(fromId);
}
$('powerBtn').addEventListener('click', () => start());
window.addEventListener('pointerdown', () => { if (ac) ac.resume(); }, { once: true });

// 놀이에서 돌아왔으면 바로 켜짐
const from = new URLSearchParams(location.search).get('from');
if (from) start(from);
</script>
