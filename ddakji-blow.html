<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딱지 불기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 레이아웃: 웹캠 전체 화면. 주먹을 쥐었다 펴면 바닥에 딱지 더미가 쌓이고, 입으로 후! 불면 날아감. 글자·패널 없이 아래 동그라미 버튼 하나만 (다른 놀이와 같은 틀) */
  :root {
    --ink: #2b2118;
    --white: #ffffff;
    --accent: #ffd23f;
    --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: #14110e; color: var(--white); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #14110e; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 50%; }

  /* 아래 가운데 동그라미: 뒤집어서 내 것이 된 딱지 수, 누르면 바닥 치우기 */
  .ring { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: 64px; height: 64px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }
  .ring-gauge { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-icon { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); transition: transform 300ms ease; }
  .ring:hover .ring-icon, .ring:active .ring-icon { transform: translate(-50%, -50%) rotate(-180deg); }
  .ring circle { fill: none; }
  .ring-track { stroke: var(--white); stroke-width: 3; }
  .ring-level { stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 176; stroke-dashoffset: 176; transition: stroke-dashoffset 60ms linear; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); padding: 16px; text-align: center; }
  .intro { display: grid; gap: 16px; justify-items: center; max-width: 380px; }
  .intro h1 { font-family: var(--display); font-weight: 400; font-size: 40px; margin: 0; }
  .intro p { margin: 0; line-height: 1.6; font-size: 16px; }
  .start { font-family: var(--display); font-size: 18px; color: var(--ink); background: var(--white); padding: 12px 24px; border-radius: 999px; }
  .start:focus-visible { border-radius: 999px; }
  .intro small { font-size: 13px; line-height: 1.5; opacity: .8; }
  .err { color: var(--white); font-size: 14px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .ring-icon { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="fx"></canvas>

  <button class="ring" id="reset" type="button" aria-label="바닥 치우기">
    <svg class="ring-gauge" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="ring-track" cx="32" cy="32" r="28"/>
      <circle class="ring-level" id="ringLevel" cx="32" cy="32" r="28"/>
    </svg>
    <svg class="ring-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M19.5 3.5v5h-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="overlay" id="overlay">
    <div class="intro">
      <h1>딱지 불기</h1>
      <p><b>주먹을 꼭 쥐었다가 손바닥을 쫙 펴면</b><br>바닥에 딱지가 10장씩 툭툭 쌓여요 (최대 50장).<br>입으로 <b>"후!"</b> 불어서 날려보세요.<br>뒤집혀서 떨어진 딱지는 내 거예요.</p>
      <button class="start" id="start" type="button">카메라·마이크 켜고 시작</button>
      <small>마이크는 MacBook 마이크로 골라주세요.<br>마이크가 안 되면 스페이스바를 누르고 있다 떼서 불어요 (오래 누를수록 세게).<br>손이 안 보일 땐 화면을 클릭하면 쌓여요.</small>
      <div class="err" id="err" hidden></div>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('cam');
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
const ringLevel = document.getElementById('ringLevel');
const errEl = document.getElementById('err');

/* ───── 손으로 조절하기 쉬운 값들 ───── */
const TUNE = {
  perOpen: 10,         // 손바닥을 한 번 펼 때마다 더 쌓이는 딱지 수
  maxPile: 50,         // 더미에 쌓일 수 있는 최대 딱지 수
  fistFrames: 4,       // 주먹을 이만큼(프레임) 쥐고 있어야 '쥔 것'으로 인정
  micSens: 5,          // 마이크 감도 (클수록 약하게 불어도 날아감)
  trigger: 0.12,       // 입김이 이보다 세면 '후!'로 인정
  cardSize: 0.13,      // 딱지 크기 (화면 짧은 쪽의 몇 배)
  pileY: 0.74,         // 딱지 더미가 쌓이는 바닥 높이 (화면 위에서부터 비율)
  floor: 0.86,         // 날아간 딱지가 떨어지는 바닥 높이
};

/* 딱지 색 (앞면 / 접힌 날개 / 뒷면). 그림은 drawFace만 바꾸면 됨 */
const COLORS = [
  { front: '#e8452c', flap: '#b8301c', back: '#2f6fd6' },
  { front: '#2f6fd6', flap: '#1f4fa0', back: '#f2b705' },
  { front: '#3a9d5d', flap: '#277043', back: '#e8452c' },
  { front: '#f2b705', flap: '#c08f00', back: '#7a4cc2' },
  { front: '#7a4cc2', flap: '#58328f', back: '#3a9d5d' },
];

let W = 0, H = 0, dpr = 1;
let pile = [], flown = [], particles = [], wobble = 0;
let fistCount = 0, wasFist = false, lastHandSeen = -1e9;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

/* ───── 주먹 → 손바닥 펴기 = 손바닥 위에 딱지 더미가 '짠' ───── */
const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0)) || 1e-6;
function handShape(w) {
  let curled = 0, open = 0;
  for (const [tip, pip] of [[8, 6], [12, 10], [16, 14], [20, 18]]) {
    const t = d3(w[tip], w[0]), p = d3(w[pip], w[0]);
    if (t < p * 1.1) curled++;      // 손가락 끝이 둘째 마디보다 손목에 가까우면 접힘
    if (t > p * 1.1) open++;        // 멀면 펴짐
  }
  return { fist: curled >= 3, open: open >= 3 };   // 손가락 하나쯤 애매해도 인정
}
// 바닥 가운데에 딱지가 위에서 한 장씩 툭툭 떨어지며 쌓임
// 주먹 쥐었다 펼 때마다 더미 위에 10장씩 더 쌓임 (최대 50장)
function newPile() {
  const n = Math.min(TUNE.perOpen, TUNE.maxPile - pile.length);
  if (n <= 0) { wobble = 0.3; playTap(0.4); return; }   // 꽉 찼으면 더미만 들썩
  for (let k = 0; k < n; k++) pile.push({ c: COLORS[(pile.length + k) % COLORS.length], ox: (Math.random() - 0.5) * 0.12, rot: (Math.random() - 0.5) * 0.25, drop: -(H * 0.9) - k * 60, vy: 0, landed: false });
  playPop();
}
function clearFloor() { flown.forEach(d => d.fade = true); }   // 바닥에 떨어진 딱지는 서서히 사라짐
// 더미가 높아지면 딱지 사이 간격을 좁혀서 화면 위로 너무 솟지 않게
function gap() { return Math.min(0.06, 2.2 / Math.max(1, pile.length)); }
function pileBase() { return { x: W / 2, y: H * TUNE.pileY }; }
function readHand() {
  if (window.trackFrame) { try { window.trackFrame(); } catch (e) { console.error(e); } }
  const hd = window.handData && window.handData[0];
  if (!hd) { handState = null; return; }
  lastHandSeen = performance.now();
  const s = hd.s, shape = handShape(hd.w);
  if (shape.fist) { if (++fistCount >= TUNE.fistFrames) wasFist = true; } else fistCount = 0;
  if (shape.open && wasFist) { wasFist = false; newPile(); }
  // 손 상태 표시용 (손목 쪽에 작은 동그라미: 주먹 쥐면 채워지고, 펴면 짠)
  const c = [0, 5, 9, 13, 17].reduce((a, i) => ({ x: a.x + s[i].x / 5, y: a.y + s[i].y / 5 }), { x: 0, y: 0 });
  handState = { x: c.x, y: c.y, fist: wasFist };
}
let handState = null;

/* ───── 후! 불면 위에서부터 날아감 ───── */
function cardSize() { return Math.min(W, H) * TUNE.cardSize; }
function impulse(peak) {
  spawnWind(peak);
  if (!pile.length || pile.some(d => !d.landed)) return;
  const palm = pileBase();
  if (peak < 0.2) { wobble = 0.3; playTap(0.4); return; }
  const n = Math.min(pile.length, 1 + Math.floor((peak - 0.2) * 9));
  const s = cardSize();
  for (let k = 0; k < n; k++) {
    const d = pile.pop(), idx = pile.length, dir = Math.random() < 0.5 ? -1 : 1;
    flown.push({
      ...d, x: palm.x + d.ox * s, y: palm.y - idx * s * gap(), s,
      vx: dir * (2 + Math.random() * (4 + peak * 9)), vy: -(6 + peak * 12 + Math.random() * 4),
      angle: 0, av: (0.1 + Math.random() * (0.12 + peak * 0.4)) * (Math.random() < 0.5 ? -1 : 1), spin: (Math.random() - 0.5) * 0.1,
      ground: H * TUNE.floor + (Math.random() - 0.5) * H * 0.06, resting: false, flipped: false, delay: k * 3, life: 1,
    });
  }
  playWhoosh(peak);
}
function stepPhysics() {
  if (wobble > 0) wobble -= 0.02;
  // 쌓이는 중인 딱지: 떨어지다가 더미 위에 '탁'
  pile.forEach((d, i) => {
    if (d.landed) return;
    d.vy += 1.2; d.drop += d.vy;
    if (d.drop >= 0) { d.drop = 0; d.landed = true; playTap(0.5); spawnDust(pileBase().x, pileBase().y - i * cardSize() * gap(), cardSize() * 0.6); }
  });
  for (const d of flown) {
    if (d.fade) d.life -= 0.02;
    if (d.resting) continue;
    if (d.delay > 0) { d.delay--; continue; }
    d.x += d.vx; d.vx *= 0.985;
    d.y += d.vy; d.vy += 0.6;
    d.angle += d.av; d.rot += d.spin;
    if (d.x < d.s * 0.5 || d.x > W - d.s * 0.5) { d.vx *= -0.5; d.x = Math.max(d.s * 0.5, Math.min(W - d.s * 0.5, d.x)); }
    if (d.vy > 0 && d.y >= d.ground) {
      d.y = d.ground; d.resting = true;
      d.flipped = Math.cos(d.angle) < 0;           // 뒤집혀서 떨어졌으면 내 딱지!
      d.angle = d.flipped ? Math.PI : 0;
      spawnDust(d.x, d.y, d.s);
      if (d.flipped) { spawnStars(d.x, d.y - d.s * 0.3); playWin(); } else playTap(1);
    }
  }
  flown = flown.filter(d => d.life > 0);
}

/* ───── 그리기 ───── */
function drawFace(s, c, front) {
  const h = s / 2;
  ctx.fillStyle = front ? c.front : c.back;
  ctx.strokeStyle = '#2b2118'; ctx.lineWidth = Math.max(2, s * 0.03);
  ctx.beginPath(); ctx.rect(-h, -h, s, s); ctx.fill(); ctx.stroke();
  if (front) {
    ctx.fillStyle = c.flap;
    ctx.beginPath();
    ctx.moveTo(-h, -h); ctx.lineTo(0, 0); ctx.lineTo(h, -h); ctx.closePath();
    ctx.moveTo(-h, h); ctx.lineTo(0, 0); ctx.lineTo(h, h); ctx.closePath();
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(-h, -h); ctx.lineTo(h, h); ctx.moveTo(h, -h); ctx.lineTo(-h, h); ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,247,230,.75)'; ctx.lineWidth = Math.max(1.5, s * 0.02);
    ctx.strokeRect(-h * 0.6, -h * 0.6, s * 0.6, s * 0.6);
  }
}
// 살짝 눕혀서 본 딱지 (angle로 앞뒤가 뒤집힘)
function drawOne(d, x, y, angle, rot, s, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(rot);
  const c = Math.cos(angle);
  ctx.scale(1, Math.max(Math.abs(c), 0.05) * 0.55 * (c < 0 ? -1 : 1));
  drawFace(s, d.c, c >= 0);
  ctx.restore();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const d of flown) if (d.resting) {
    if (d.flipped) {   // 내 딱지는 은은하게 빛남
      ctx.save(); ctx.globalAlpha = d.life * 0.5; ctx.fillStyle = '#ffe680';
      ctx.beginPath(); ctx.ellipse(d.x, d.y, d.s * 0.75, d.s * 0.35, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    drawOne(d, d.x, d.y, d.angle, d.rot, d.s, d.life);
  }
  if (pile.length) {
    const s = cardSize(), base = pileBase();
    ctx.fillStyle = 'rgba(0,0,0,.28)';   // 바닥 그림자
    ctx.beginPath(); ctx.ellipse(base.x, base.y + s * 0.12, s * 0.65, s * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    pile.forEach((d, i) => {
      const top = i === pile.length - 1, wob = top && wobble > 0 ? Math.sin(performance.now() / 40) * wobble : 0;
      drawOne(d, base.x + d.ox * s, base.y - i * s * gap() + d.drop - (top && wobble > 0 ? wobble * s * 0.3 : 0), wob, d.rot, s);
    });
  }
  // 손 상태: 주먹을 쥐면 손 위에 노란 점이 차오름 → 펴면 딱지가 쌓임
  if (handState && handState.fist) {
    ctx.fillStyle = 'rgba(255,210,63,.9)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(handState.x, handState.y, 10 + Math.sin(performance.now() / 120) * 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  for (const d of flown) if (!d.resting) drawOne(d, d.x, d.y, d.angle, d.rot, d.s, d.life);
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life, 0);
    if (p.kind === 'wind') {
      ctx.strokeStyle = '#fff7e6'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 4, p.y - p.vy * 4); ctx.stroke();
    } else if (p.kind === 'star') {
      ctx.fillStyle = '#ffe680'; const s = p.r;
      ctx.beginPath(); ctx.moveTo(p.x, p.y - s); ctx.quadraticCurveTo(p.x, p.y, p.x + s, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + s); ctx.quadraticCurveTo(p.x, p.y, p.x - s, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - s); ctx.fill();
    } else {
      ctx.fillStyle = '#d9cbb3'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function stepParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life -= p.decay; if (p.kind !== 'wind') p.vy += 0.05; }
  particles = particles.filter(p => p.life > 0);
}
function spawnWind(peak) {
  const palm = { ...pileBase(), w: cardSize() * 1.6 };
  const n = Math.round(8 + peak * 24);
  for (let i = 0; i < n; i++) particles.push({ kind: 'wind', x: palm.x + (Math.random() - 0.5) * palm.w * 1.5, y: palm.y - palm.w * (0.8 + Math.random() * 0.8),
    vx: (Math.random() - 0.5) * 2, vy: 5 + peak * 9 + Math.random() * 3, life: 1, decay: 0.04 });
}
function spawnDust(x, y, s) {
  for (let i = 0; i < 10; i++) particles.push({ kind: 'dust', x: x + (Math.random() - 0.5) * s, y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, r: 2 + Math.random() * 3, life: 1, decay: 0.03 });
}
function spawnStars(x, y) {
  for (let i = 0; i < 8; i++) { const a = Math.random() * Math.PI * 2; particles.push({ kind: 'star', x, y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3 - 1, r: 5 + Math.random() * 5, life: 1, decay: 0.025 }); }
}

/* ───── 입김 감지: 마이크 소리 크기 + 저음 비율(바람 소리는 저음이 많음) ───── */
let analyser = null, timeBuf, freqBuf, sampleRate = 48000, ac = null;
let level = 0, burst = null, cooldown = 0, spaceDown = 0;
function readBlow() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(timeBuf);
  let sum = 0; for (let i = 0; i < timeBuf.length; i++) sum += timeBuf[i] * timeBuf[i];
  const rms = Math.sqrt(sum / timeBuf.length);
  analyser.getByteFrequencyData(freqBuf);
  const binHz = sampleRate / analyser.fftSize;
  let low = 0, total = 0;
  for (let i = 1; i < freqBuf.length; i++) { const hz = i * binHz; if (hz > 8000) break; total += freqBuf[i]; if (hz < 600) low += freqBuf[i]; }
  const ratio = total ? low / total : 0;
  return Math.min(1, rms * TUNE.micSens * (ratio > 0.4 ? 1 : 0.35));
}
function readKeyboard() { return spaceDown ? Math.min(1, (performance.now() - spaceDown) / 1200) : 0; }
function stepBlow() {
  level = Math.max(Math.max(readBlow(), readKeyboard()), level * 0.85);
  if (cooldown > 0) { cooldown--; return; }
  if (!spaceDown) {
    if (burst === null && level > TUNE.trigger) burst = { peak: level, frames: 0 };
    if (burst) { burst.peak = Math.max(burst.peak, level); if (++burst.frames > 12) { impulse(burst.peak); burst = null; cooldown = 40; } }
  }
}

/* ───── 소리 ───── */
function tone(f, t0, dur, type = 'sine', vol = 0.08, f2) {
  if (!ac) return;
  const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, freq, vol) {
  if (!ac) return;
  const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f).connect(g).connect(ac.destination); src.start();
}
function playPop() { tone(400, 0, 0.12, 'sine', 0.12, 900); }
function playTap(v) { noise(0.06, 1500, 0.5 * v); }                       // 딱지가 바닥에 '탁'
function playWhoosh(p) { noise(0.3, 700, 0.2 + p * 0.3); }
function playWin() { tone(880, 0, 0.12, 'triangle', 0.07); tone(1320, 0.08, 0.2, 'triangle', 0.07); }

/* ───── 키보드·마우스 대체 ───── */
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spaceDown && e.target.tagName !== 'BUTTON') { spaceDown = performance.now(); e.preventDefault(); }   // 비상용: 누르고 있다 떼면 '후!' (오래 누를수록 세게)
  if (e.code === 'KeyR' && !e.repeat && !e.metaKey && !e.ctrlKey) newPile();
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' && spaceDown) { const p = readKeyboard(); spaceDown = 0; if (p > TUNE.trigger) { impulse(p); cooldown = 20; } e.preventDefault(); }
});
canvas.addEventListener('pointerdown', () => { if (performance.now() - lastHandSeen > 2000) newPile(); });   // 손이 안 보일 땐 클릭으로 쌓기

function loop() {
  requestAnimationFrame(loop);
  readHand(); stepBlow(); stepPhysics(); stepParticles(); draw();
  // 아래 동그라미: 뒤집어서 내 것이 된 딱지 비율
  const got = flown.filter(d => d.flipped && !d.fade).length;
  const total = got + pile.length + flown.filter(d => !d.flipped && !d.fade).length;
  ringLevel.style.strokeDashoffset = 176 * (1 - (total ? got / total : 0));
}

const ERR_TEXT = {
  NotAllowedError: '권한이 거부됐어요',
  NotFoundError: '장치를 찾지 못했어요',
  NotReadableError: '다른 앱이 쓰고 있거나 맥 시스템 설정에서 막혀 있어요',
  NoMediaDevices: '이 화면에서는 카메라를 쓸 수 없어요 (크롬에서 직접 열어주세요)',
};
async function start() {
  const startBtn = document.getElementById('start');
  startBtn.disabled = true; startBtn.textContent = '허용을 기다리는 중…';
  ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
  const msgs = [];
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) msgs.push(ERR_TEXT.NoMediaDevices);
  else {
    try {
      const v = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 } });
      video.srcObject = v; video.play().catch(() => {});
    } catch (e) { msgs.push('카메라: ' + (ERR_TEXT[e.name] || e.name)); }
    try {
      const a = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      sampleRate = ac.sampleRate;
      analyser = ac.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.2;
      ac.createMediaStreamSource(a).connect(analyser);
      timeBuf = new Float32Array(analyser.fftSize); freqBuf = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { msgs.push('마이크: ' + (ERR_TEXT[e.name] || e.name)); }
  }
  if (msgs.length) {
    errEl.innerHTML = msgs.join('<br>') + '<br>일단 들어가면 스페이스바로 불 수 있어요.';
    errEl.hidden = false;
    startBtn.disabled = false; startBtn.textContent = '그래도 들어가기';
    startBtn.removeEventListener('click', start);
    startBtn.addEventListener('click', () => { document.getElementById('overlay').hidden = true; }, { once: true });
    return;
  }
  document.getElementById('overlay').hidden = true;
}
document.getElementById('start').addEventListener('click', start);
document.getElementById('reset').addEventListener('click', () => { pile = []; flown = []; document.getElementById('reset').blur(); });   // 더미와 바닥 모두 치우기

resize();
requestAnimationFrame(loop);
</script>

<script type="module">
/* 손 인식 (MediaPipe): 손 21개 점의 화면 위치와 3D 위치 */
import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

let handLandmarker = null, visionFiles = null, delegate = 'GPU', lastVideoTime = -1, switching = false;
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

async function createModel(dg) {
  handLandmarker = await HandLandmarker.createFromOptions(visionFiles, {
    baseOptions: { modelAssetPath: HAND_MODEL, delegate: dg },
    runningMode: 'VIDEO', numHands: 1,
    minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4,
  });
  delegate = dg;
}
async function fallbackToCPU() {
  if (switching || delegate === 'CPU') return;
  switching = true; handLandmarker = null;
  try { await createModel('CPU'); } catch (e) { console.error(e); }
  switching = false;
}

// 카메라 화면 속 점(0~1)을 실제 화면 좌표로 (거울 모드 + 화면 꽉 채우기 반영)
function toScreen(p) {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const scale = Math.max(W / vw, H / vh);
  const offX = (W - vw * scale) / 2, offY = (H - vh * scale) / 2;
  return { x: W - (p.x * vw * scale + offX), y: p.y * vh * scale + offY };
}

let handLms = [], handWorld = [], handedness = [];
window.trackFrame = () => {
  if (handLandmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    try {
      const r = handLandmarker.detectForVideo(video, performance.now());
      handLms = r.landmarks || [];
      handWorld = r.worldLandmarks || [];
      handedness = (r.handedness || []).map(x => x && x[0] ? x[0].categoryName : '');
    } catch (e) { console.error(e); fallbackToCPU(); }
  }
  // 손의 21개 점: s = 화면 위치, w = 실제 3D 위치(미터). 3D를 써야 카메라 쪽으로 겨눠도 손가락 굽힘을 정확히 앎
  window.handData = handLms.map((lm, k) => ({
    id: handedness[k] || 'h' + k,
    s: lm.map(toScreen),
    w: (handWorld[k] && handWorld[k].length === 21) ? handWorld[k].map(p => ({ x: p.x, y: p.y, z: p.z })) : lm.map(p => ({ x: p.x, y: p.y, z: p.z })),
  }));
};

try {
  visionFiles = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  try { await createModel('GPU'); }
  catch (e) { console.warn('GPU 실패, CPU로 다시 시도', e); await createModel('CPU'); }
} catch (e) {
  console.warn('손 인식을 불러오지 못했어요. 마우스로 대신할 수 있어요.', e);
}
</script>

    /* 모니터 (홈과 같은 치수) */
    .xpf-monitor { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 1000; pointer-events: none; }

    .xpf-start { display: flex; align-items: center; padding: 0 1.4em 0 1em; border-radius: 0 12px 12px 0; color: #fff; font-family: "Jua", sans-serif; font-style: italic; cursor: pointer;
      background: linear-gradient(180deg, #5eb75e 0%, #3c9a3c 12%, #3a993a 70%, #2f7f2f 100%); box-shadow: inset -1px 0 2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 1px 1px 1px rgba(0,0,0,.5); }

      background: linear-gradient(180deg, #19b9f3 0%, #0f8fe0 10%, #0f8bdc 85%, #0c6fbf 100%); box-shadow: inset 1px 0 0 #0b5ea8, inset 2px 0 0 rgba(255,255,255,.25); }
  `;
  document.head.appendChild(css);
  const cam = document.getElementById('cam');
  if (cam) for (const k of ['xpf-dots', 'xpf-rgb']) { const d = document.createElement('div'); d.className = k; cam.after(d); }
  window.addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); });

  const BTNS = `<button class="xpf-btn" type="button" data-act="min" aria-label="닫고 홈으로"><svg viewBox="0 0 12 12"><rect x="2" y="8" width="6" height="2.4" fill="#fff"/></svg></button>
    <button class="xpf-btn" type="button" data-act="max" aria-label="전체 화면"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="1.5" y="1.5" width="9" height="2.4" fill="#fff"/></svg></button>
    <button class="xpf-btn xpf-x" type="button" data-act="close" aria-label="닫고 홈으로"><span class="xpf-fill"></span><svg viewBox="0 0 12 12"><path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>`;
  const bar = document.createElement('div');
  bar.className = 'xpf-bar';
  bar.innerHTML = `<span class="xpf-ico"></span><span class="xpf-title">${NAMES[here] || document.title}</span>${BTNS}`;
  document.body.appendChild(bar);
  const sides = ['l', 'r', 'b'].map(() => { const d = document.createElement('div'); d.className = 'xpf-side'; document.body.appendChild(d); return d; });
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'max') {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
      b.blur();
    } else goHome();
  });

  // ───── 모니터 모드: 놀이 화면(#stage)을 창 안 크기로 줄여서 넣음 ─────
  let mon = null, glass = null, task = null, map = { s: 1, tx: 0, ty: 0 };
  const stage = document.getElementById('stage');
  if (shell) {
    mon = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); mon.setAttribute('class', 'xpf-monitor'); document.body.appendChild(mon);
    glass = document.createElement('div'); glass.className = 'xpf-glass'; document.body.appendChild(glass);
    const led = document.createElement('div'); led.className = 'xpf-led'; document.body.appendChild(led);
    task = document.createElement('div'); task.className = 'xpf-task';
    task.innerHTML = `<div class="xpf-start">시작</div><div class="xpf-tasks"><div class="xpf-tb">${NAMES[here] || ''}</div></div><div class="xpf-tray"><span class="xpf-clock"></span></div>`;
    document.body.appendChild(task);
    task.querySelector('.xpf-start').addEventListener('click', goHome);
    const clock = () => { const d = new Date(); task.querySelector('.xpf-clock').textContent = (d.getHours() < 12 ? '오전 ' : '오후 ') + ((d.getHours() + 11) % 12 + 1) + ':' + String(d.getMinutes()).padStart(2, '0'); };
    clock(); setInterval(clock, 10000);
    document.documentElement.style.background = '#e9e1cd';
  }
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  const realW = () => document.documentElement.clientWidth, realH = () => document.documentElement.clientHeight;
  let body = null;
  function layout() {
    const W = realW(), H = realH();
    if (!shell) {
      place(bar, 0, 0, W, 30);
      place(sides[0], 0, 30, 4, H - 30); place(sides[1], W - 4, 30, 4, H - 30); place(sides[2], 0, H - 4, W, 4);

    }
    // 홈 index.html과 같은 숫자: 테두리 3.2vmin, 아래 7.5vmin, 안쪽 홈 1.3vmin, 작업표시줄 clamp(30px, 4.6vmin, 44px)
    const vm = Math.min(W, H) / 100, pad = 3.2 * vm, padB = 7.5 * vm, rec = 1.3 * vm;
    const sx = pad + rec, sy = pad + rec, sw = W - 2 * (pad + rec), sh = H - pad - padB - 2 * rec;
    const rx = 3.6 * vm, ry = 4.2 * vm, barH = Math.max(30, Math.min(44, 4.6 * vm));
    // 아이보리 테두리 (가운데 화면 자리만 뚫림)
    const rr = (x, y, w, h, a, b) => `M${x + a},${y} H${x + w - a} A${a},${b} 0 0 1 ${x + w},${y + b} V${y + h - b} A${a},${b} 0 0 1 ${x + w - a},${y + h} H${x + a} A${a},${b} 0 0 1 ${x},${y + h - b} V${y + b} A${a},${b} 0 0 1 ${x + a},${y} Z`;
    mon.setAttribute('viewBox', `0 0 ${W} ${H}`);
    mon.innerHTML = `<defs><radialGradient id="xpfIv" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#f8f3e6"/><stop offset=".55" stop-color="#ece4cf"/><stop offset="1" stop-color="#ddd2b8"/></radialGradient>
      <linearGradient id="xpfRec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfc4a8"/><stop offset="1" stop-color="#e2d8bf"/></linearGradient></defs>
      <path fill="url(#xpfIv)" fill-rule="evenodd" d="M0,0 H${W} V${H} H0 Z ${rr(pad, pad, W - 2 * pad, H - pad - padB, 2.4 * vm, 2.4 * vm)}"/>
      <path fill="url(#xpfRec)" fill-rule="evenodd" d="${rr(pad, pad, W - 2 * pad, H - pad - padB, 2.4 * vm, 2.4 * vm)} ${rr(sx, sy, sw, sh, rx, ry)}"/>`;
    place(glass, sx, sy, sw, sh);
    // 창(제목줄 + 파란 테두리 3px)과 작업표시줄
    place(bar, sx, sy, sw, 29);
    place(task, sx, sy + sh - barH, sw, barH);
    task.style.fontSize = (barH * 0.36) + 'px'; task.querySelector('.xpf-start').style.fontSize = (barH * 0.5) + 'px';
    task.style.borderRadius = `0 0 ${rx}px ${rx}px / 0 0 ${ry}px ${ry}px`;
    bar.style.borderRadius = `${rx}px ${rx}px 0 0 / ${ry}px ${ry}px 0 0`; bar.style.paddingLeft = (rx * 0.6 + 8) + 'px'; bar.style.paddingRight = (rx * 0.5 + 4) + 'px';
    const by = sy + 29, bh = sh - barH - 29 - 3, bx = sx + 3, bw = sw - 6;
    place(sides[0], sx, by, 3, bh + 3); place(sides[1], sx + sw - 3, by, 3, bh + 3); place(sides[2], sx, by + bh, sw, 3);

    map = { s: 1, tx: bx, ty: by };
    body = { w: Math.round(bw), h: Math.round(bh) };
    if (stage) Object.assign(stage.style, { inset: 'auto', left: bx + 'px', top: by + 'px', width: body.w + 'px', height: body.h + 'px', overflow: 'hidden' });
  }
  if (shell) {
    Object.defineProperty(window, 'innerWidth', { configurable: true, get: () => body ? body.w : realW() });
    Object.defineProperty(window, 'innerHeight', { configurable: true, get: () => body ? body.h : realH() });
  }
  let relaying = false;
  function relayout() {
    if (relaying) return; relaying = true;
    layout();
    if (shell) window.dispatchEvent(new Event('resize'));   // 놀이가 새 크기로 다시 그리게
    relaying = false;
  }
  relayout(); addEventListener('resize', relayout);

  // 마우스 좌표도 줄인 화면에 맞게 바꿔줌 (놀이 화면 안 캔버스 클릭이 제자리를 가리키도록)
  if (shell && stage) {
    for (const type of ['pointerdown', 'pointermove', 'pointerup']) {
      stage.addEventListener(type, e => {
        if (e.__xpf || !(e.target instanceof HTMLCanvasElement)) return;
        e.stopImmediatePropagation();
        const ev = new PointerEvent(type, { bubbles: true, cancelable: true, clientX: (e.clientX - map.tx) / map.s, clientY: (e.clientY - map.ty) / map.s, button: e.button, buttons: e.buttons, pointerId: e.pointerId });
        ev.__xpf = true; e.target.dispatchEvent(ev);
      }, true);
    }
  }

  // 손으로: 놀이마다 손 정보 모양이 달라서 검지 끝 위치를 찾아봄 (놀이 화면 좌표 → 실제 화면 좌표)
  function fingerTip() {
    const hds = window.handData || [];
    let p = null;
    for (const hd of hds) {
      if (!hd) continue;
      if (hd.s && hd.s[8]) { p = hd.s[8]; break; }
      if (hd.index) { p = hd.index; break; }
      if (hd.tips && hd.tips[0]) { p = hd.tips[0]; break; }
      if (hd.anchor) { p = hd.anchor; break; }
    }
    if (!p) try { if (typeof hand !== 'undefined' && hand && hand.pinch) p = hand.pinch; } catch (e) {}
    return p && { x: p.x * map.s + map.tx, y: p.y * map.s + map.ty };
  }
  const xBtn = bar.querySelector('.xpf-x'), fill = bar.querySelector('.xpf-fill');
  let since = 0;
  function tick(t) {
    requestAnimationFrame(tick);
    const p = fingerTip(), r = xBtn.getBoundingClientRect();
    const on = p && Math.abs(p.x - (r.left + r.width / 2)) < 60 && p.y - (r.top + r.height / 2) < 80 && p.y > r.top - 60;   // ✕ 근처(넉넉하게)
    if (on) { if (!since) since = t; } else since = 0;
    const k = since ? Math.min(1, (t - since) / HOLD_MS) : 0;
    fill.style.height = (k * 100) + '%';
    xBtn.classList.toggle('hot', !!on);
    if (k >= 1) goHome();
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
